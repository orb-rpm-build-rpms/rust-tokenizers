[package]
summary = "Implementation of today's most used tokenizers in Rust"
cargo-toml-patch-comments = [
    "Allow newer (but still compatible) monostate versions",
    """\
Allow all fancy-regex versions from 0.13 through 0.17: \
https://github.com/huggingface/tokenizers/pull/1940\
""",
    "Upgrade indicatif dependency from 0.17 to 0.18",
    "Downgrade onig dependency from 6.5.1 to 6.4.0",
    "Drop criterion dev-dependency",
]

# hide the optional features using wasm
[features]
hide = [
    "unstable_wasm",
]

[tests]
comments = [
    "skip doctest that's missing a data file",
    "skip failing tests that are missing data files",
    "skip unigram test_sample which is flaky:",
    "https://github.com/huggingface/tokenizers/issues/461",
]
run = [
    "doc",
    "test:added_tokens",
    # documentation test fails entirely
    # "test:documentation",
    "test:from_pretrained",
    # offsets test fails entirely
    # "test:offsets",
    "test:serialization",
    # stream test fails entirely
    # "test:stream",
    # training test fails entirely
    # "test:training",
    # unigram has two online tests and one flake
    # "test:unigram",
]
skip.doc = [
    "926",
]
skip-exact.doc = false
skip."test:added_tokens" = [
    "lstrip_tokens",
    "overlapping_tokens",
    "rstrip_tokens",
    "single_word_tokens",
]
skip-exact."test:added_tokens" = true
skip."test:serialization" = [
    "bpe_serde",
    "test_deserialize_long_file",
    "wordlevel_serde",
    "wordpiece_serde",
]
skip-exact."test:serialization" = true
