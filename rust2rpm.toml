[package]
summary = "Implementation of today's most used tokenizers in Rust"
cargo-toml-patch-comments = [
    """\
Update monostate dependency to v1: \
https://github.com/huggingface/tokenizers/pull/2242\
""",
    """\
Update fancy-regex dependency to 0.18: \
https://github.com/huggingface/tokenizers/pull/2243; \
also allow older 0.16, https://bugzilla.redhat.com/show_bug.cgi?id=2321464\
""",
    "Drop criterion dev-dependency",
]

[[package.extra-patches]]
number = 10
file = "0001-Downstream-only-don-t-run-doctests-that-require-data.patch"
comments = [
    "Downstream-only: don’t run doctests that require data files",
]

# hide the optional features using wasm
[features]
hide = [
    "unstable_wasm",
]

[tests]
comments = [
    """\
Everything in test:documentation, test:offsets, test:stream, and test:training \
requires data files downloaded from huggingface hub.\
""",
    """\
Most tests in test:unigram require data files downloaded from huggingface hub, \
and the remaining test (test_sample) is known to be flaky, \
https://github.com/huggingface/tokenizers/issues/461.\
""",
]
run = [
    "doc",
    "test:added_tokens",
    # "test:documentation",
    "test:from_pretrained",
    # "test:offsets",
    "test:serialization",
    # "test:stream",
    # "test:training",
    # "test:unigram",
]
skip.doc = [
    "926",
]
skip-exact.doc = false
skip."test:added_tokens" = [
    "lstrip_tokens",
    "overlapping_tokens",
    "rstrip_tokens",
    "single_word_tokens",
]
skip-exact."test:added_tokens" = true
skip."test:serialization" = [
    "bpe_serde",
    "test_deserialize_long_file",
    "wordlevel_serde",
    "wordpiece_serde",
]
skip-exact."test:serialization" = true
